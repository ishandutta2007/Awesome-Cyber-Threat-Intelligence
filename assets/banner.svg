<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)" />
      <stop offset="100%" stop-color="rgba(129, 140, 248, 0.05)" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.35; }
      }
      @keyframes floatParticle1 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes floatParticle2 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(20px) translateX(-20px); opacity: 0.7; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.2); opacity: 1; }
      }
      @keyframes dashStream {
        to { stroke-dashoffset: -100; }
      }
      .grid-layer { animation: pulseGrid 8s ease-in-out infinite; }
      .p1 { animation: floatParticle1 6s ease-in-out infinite; }
      .p2 { animation: floatParticle2 8s ease-in-out infinite; }
      .radar-line { transform-origin: 1040px 210px; animation: radarSweep 10s linear infinite; }
      .stream-line { stroke-dasharray: 6 8; animation: dashStream 4s linear infinite; }
      .node-pulse { transform-origin: center; animation: pulseNode 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Background Dynamic Pattern Grid -->
  <g class="grid-layer" stroke="#38bdf8" stroke-width="0.75">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="120" y1="0" x2="120" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="360" y1="0" x2="360" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="840" y1="0" x2="840" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1080" y1="0" x2="1080" y2="420" />
  </g>

  <!-- Ambient Decorative Glowing Orbs -->
  <circle cx="150" cy="90" r="120" fill="#38bdf8" opacity="0.08" filter="url(#glowCyan)" />
  <circle cx="1020" cy="210" r="160" fill="#818cf8" opacity="0.12" filter="url(#glowPurple)" />

  <!-- Animated Threat Radar on Right (Background decorative) -->
  <g opacity="0.45">
    <circle cx="1040" cy="210" r="150" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3" />
    <circle cx="1040" cy="210" r="105" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="1040" cy="210" r="60" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <line x1="890" y1="210" x2="1190" y2="210" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
    <line x1="1040" y1="60" x2="1040" y2="360" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
    <line class="radar-line" x1="1040" y1="210" x2="1190" y2="210" stroke="#38bdf8" stroke-width="2.5" filter="url(#glowCyan)" />
  </g>

  <!-- Floating Particles & Attack Data Stream Indicators -->
  <g class="p1">
    <circle cx="950" cy="140" r="4.5" fill="#38bdf8" filter="url(#glowCyan)" />
    <circle cx="1110" cy="280" r="3.5" fill="#f43f5e" filter="url(#glowCyan)" />
    <circle cx="450" cy="60" r="3" fill="#818cf8" />
  </g>
  <g class="p2">
    <circle cx="1080" cy="130" r="4" fill="#34d399" filter="url(#glowCyan)" />
    <circle cx="980" cy="300" r="5" fill="#fbbf24" />
    <circle cx="320" cy="370" r="3" fill="#38bdf8" />
  </g>

  <!-- Connecting Stream Paths -->
  <path d="M 860 160 Q 940 210 1020 180 T 1140 250" fill="none" stroke="#818cf8" stroke-width="1.5" class="stream-line" opacity="0.6" />
  <path d="M 890 280 Q 980 230 1060 270 T 1160 180" fill="none" stroke="#38bdf8" stroke-width="1.5" class="stream-line" opacity="0.5" />

  <!-- Shield Icon Foreground Branding -->
  <g transform="translate(80, 115)">
    <polygon points="45,0 90,20 90,65 45,95 0,65 0,20" fill="url(#primaryGrad)" opacity="0.15" />
    <polygon points="45,5 85,23 85,62 45,90 5,62 5,23" fill="none" stroke="url(#primaryGrad)" stroke-width="3.5" filter="url(#glowCyan)" />
    <!-- Inner Cross / Target -->
    <line x1="45" y1="28" x2="45" y2="67" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="25" y1="47.5" x2="65" y2="47.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <circle cx="45" cy="47.5" r="7" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  </g>

  <!-- Foreground Main Typography & Pills -->
  <!-- Tag Pill -->
  <g transform="translate(200, 100)">
    <rect width="255" height="30" rx="15" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="16" cy="15" r="5" fill="#10b981" />
    <text x="30" y="20" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">CURATED CTI DIRECTORY</text>
  </g>

  <!-- Title -->
  <text x="200" y="175" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
    Awesome Cyber Threat Intelligence
  </text>

  <!-- Subtitle -->
  <text x="200" y="215" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">
    Adversary Tracking • IOC Enrichment • Dark Web Monitoring • STIX 2.1 TIPs
  </text>

  <!-- Feature Pills in Foreground -->
  <g transform="translate(200, 255)">
    <!-- Pill 1: SaaS Leaders -->
    <rect x="0" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <text x="16" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🏢 SaaS Platforms</text>

    <!-- Pill 2: Open Source -->
    <rect x="175" y="0" width="170" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <text x="191" y="22" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Open-Source TIPs</text>

    <!-- Pill 3: STIX & TAXII -->
    <rect x="360" y="0" width="155" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <text x="376" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📊 STIX / TAXII 2.1</text>

    <!-- Pill 4: SOC & IR -->
    <rect x="530" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <text x="546" y="22" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎯 SOC &amp; DFIR</text>
  </g>

  <!-- Footer Tagline -->
  <text x="200" y="325" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
    Updated for Security Operations, Threat Analysts &amp; Engineering Teams Worldwide
  </text>
</svg>
